name: Build ZperOS APK

on:
  push:
    paths:
      - 'launcher/**'
      - '.github/workflows/launcher.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: launcher
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Accept Android licenses (SDK is preinstalled on ubuntu-latest)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zperos-debug-apk
          path: launcher/app/build/outputs/apk/debug/app-debug.apk
      - name: Copy APK as ZperOS.apk
        run: cp app/build/outputs/apk/debug/app-debug.apk ZperOS.apk
      - name: Publish direct download (GitHub Release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: zperos-latest
          name: ZperOS (última versión)
          body: "Descarga directa: toca **ZperOS.apk** abajo para instalar."
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: launcher/ZperOS.apk

