name: Build Android APK

on:
  push:
    branches: [ main, 'claude/**' ]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Accept Android licenses (SDK is preinstalled on ubuntu-latest)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
      - name: Install & build web bundle
        run: |
          npm ci
          npm run build
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: port-solano-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

  skyward-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Accept Android licenses (SDK is preinstalled on ubuntu-latest)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
      - name: Install & build Skyward web bundle + single-file HTML
        run: |
          npm ci
          ln -sfn ../node_modules flight/node_modules
          npm run build:flight:html
      - name: Sync Capacitor (flight/)
        working-directory: flight
        run: npx cap sync android
      - name: Build Skyward debug APK
        working-directory: flight/android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - name: Upload Skyward APK
        uses: actions/upload-artifact@v4
        with:
          name: skyward-debug-apk
          path: flight/android/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload Skyward HTML
        uses: actions/upload-artifact@v4
        with:
          name: skyward-html
          path: flight/dist/skyward.html
      - name: Publish APK (repo copy + GitHub release asset)
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release
          cp flight/android/app/build/outputs/apk/debug/app-debug.apk release/Skyward.apk
          cp flight/dist/skyward.html release/skyward.html
          gh release view skyward-latest >/dev/null 2>&1 || gh release create skyward-latest --prerelease --title "Skyward Flight Simulator (latest build)" --notes "Android APK (debug-signed) and single-file HTML, built automatically from ${{ github.ref_name }}." --target "$GITHUB_SHA"
          gh release upload skyward-latest release/Skyward.apk release/skyward.html --clobber
          git config user.name "github-actions[bot]"
          git config user.email "41898732+github-actions[bot]@users.noreply.github.com"
          git add release/Skyward.apk release/skyward.html
          git commit -m "Update Skyward APK + HTML build [skip ci]" || exit 0
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin HEAD:"${{ github.ref_name }}"
