name: Build iSuit APK

on:
  push:
    paths:
      - 'isuit/**'
      - '.github/workflows/isuit.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: isuit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk iSuit.apk
      - name: Publish direct download (GitHub Release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: isuit-latest
          name: iSuit (última versión)
          body: "Descarga directa: toca **iSuit.apk** abajo para instalar."
          target_commitish: ${{ github.sha }}
          make_latest: false
          files: isuit/iSuit.apk
