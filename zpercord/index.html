<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zpercord</title>
<style>
:root{
  --bg0:#1e1f26;      /* server rail */
  --bg1:#2c2f35;      /* sidebars */
  --bg2:#36393f;      /* chat */
  --bg3:#40444b;      /* inputs / hover */
  --bg4:#202225;      /* active */
  --line:#202225;
  --text:#dcddde;
  --muted:#72767d;
  --dim:#949ba4;
  --blue:#5865f2;
  --blue2:#7289da;
  --blue3:#4752c4;
  --green:#43b581;
  --yellow:#faa61a;
  --red:#f04747;
  --pro1:#43b581;
  --pro2:#5865f2;
  --pro3:#9c27b0;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg0);color:var(--text);font:15px/1.4 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,textarea,select{font:inherit;color:var(--text);background:var(--bg0);border:1px solid var(--line);border-radius:8px;padding:9px 11px;outline:none;width:100%}
input:focus,textarea:focus,select:focus{border-color:var(--blue)}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:8px}::-webkit-scrollbar-track{background:transparent}
.app{display:grid;grid-template-columns:72px 240px 1fr 240px;height:100vh;height:100dvh}
.app.nomembers{grid-template-columns:72px 240px 1fr}
.scrim{display:none}

/* ---------- server rail ---------- */
.rail{background:var(--bg0);display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 0;overflow-y:auto;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.sicon{position:relative;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:var(--bg3);font-weight:700;font-size:17px;transition:border-radius .18s,background .18s,transform .1s;flex:none;overflow:visible;cursor:pointer}
.sicon:active{transform:scale(.95)}
.sicon:hover,.sicon.active{border-radius:16px;background:var(--blue)}
.sicon .pill{position:absolute;left:-16px;width:8px;border-radius:0 4px 4px 0;background:#fff;height:0;transition:height .18s}
.sicon.unread .pill{height:8px}.sicon:hover .pill{height:20px}.sicon.active .pill{height:40px}
.sicon .badge{position:absolute;right:-4px;bottom:-4px;background:var(--red);font-size:11px;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;border:3px solid var(--bg0);padding:0 3px}
.sicon.add{color:var(--green);font-size:26px;font-weight:400}.sicon.add:hover{background:var(--green);color:#fff}
.sicon.boosted::after{content:"";position:absolute;inset:-3px;border-radius:inherit;border:2px solid var(--pro3);opacity:.8}
.rail .sep{width:32px;height:2px;background:var(--line);border-radius:1px;flex:none}
.tip{position:fixed;background:#020611;color:#fff;padding:6px 10px;border-radius:6px;font-size:13px;font-weight:600;pointer-events:none;z-index:999;white-space:nowrap;box-shadow:0 4px 14px #0008}

/* ---------- channel sidebar ---------- */
.side{background:var(--bg1);display:flex;flex-direction:column;min-width:0}
.shead{height:48px;display:flex;align-items:center;padding:0 14px;font-weight:700;border-bottom:1px solid var(--line);gap:8px;cursor:pointer;flex:none}
.shead:hover{background:var(--bg3)}
.shead .name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sbanner{height:90px;background-size:cover;flex:none;position:relative}
.sbanner .shead{position:absolute;inset:auto 0 0 0;border:0;background:linear-gradient(transparent,#0a1528ee)}
.clist{flex:1;overflow-y:auto;padding:8px 8px 16px}
.cat{display:flex;align-items:center;gap:4px;margin:16px 0 4px;padding:0 4px;color:var(--muted);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;cursor:pointer;user-select:none}
.cat:hover{color:var(--text)}.cat .grow{flex:1}.cat .plus{font-size:18px;line-height:1;opacity:.8}.cat .plus:hover{opacity:1}
.cat .arr{transition:transform .15s;display:inline-block}.cat.collapsed .arr{transform:rotate(-90deg)}
.chan{display:flex;align-items:center;gap:7px;padding:6px 8px;border-radius:6px;color:var(--muted);cursor:pointer;margin:1px 0;position:relative;transition:all .1s}
.chan:hover{background:var(--bg3);color:var(--text)}
.chan.active{background:var(--blue)!important;color:#fff;font-weight:600}
.chan.unread{color:#fff;font-weight:600}
.chan.unread::before{content:"";position:absolute;left:-8px;width:4px;height:8px;background:#fff;border-radius:0 4px 4px 0}
.chan .ico{width:20px;text-align:center;opacity:.8;flex:none}
.chan .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chan .gear{opacity:0;font-size:13px}.chan:hover .gear,.chan.active .gear{opacity:.75}
.chan .mbadge{background:var(--red);color:#fff;font-size:11px;border-radius:9px;padding:0 6px;font-weight:700}
.vusers{margin:0 0 4px 34px}
.vuser{display:flex;align-items:center;gap:7px;padding:3px 6px;border-radius:5px;color:var(--muted);font-size:14px}
.vuser .av{width:22px;height:22px;font-size:10px}
.vuser.speaking .av{box-shadow:0 0 0 2px var(--green)}
.vuser .live{background:var(--red);color:#fff;font-size:10px;font-weight:800;border-radius:4px;padding:0 4px;margin-left:auto}

.voicebar{background:var(--bg0);border-top:1px solid var(--line);padding:8px 10px;flex:none}
.voicebar .st{color:var(--green);font-weight:700;font-size:13px}
.voicebar .sub{color:var(--muted);font-size:12px}
.voicebar .row{display:flex;gap:6px;margin-top:8px}
.voicebar .row button{flex:1;background:var(--bg3);border-radius:6px;padding:6px 0;font-size:13px}
.voicebar .row button:hover{background:var(--bg4)}
.voicebar .row button.on{background:var(--blue)}
.voicebar .row button.danger:hover{background:var(--red)}

.userbar{height:56px;background:#071022;display:flex;align-items:center;gap:8px;padding:0 8px;flex:none}
.userbar .who{flex:1;min-width:0;cursor:pointer;border-radius:6px;padding:4px;display:flex;align-items:center;gap:8px}
.userbar .who:hover{background:var(--bg3)}
.userbar .nm{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.userbar .cs{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ibtn{width:32px;height:32px;border-radius:6px;display:grid;place-items:center;color:var(--muted);flex:none;position:relative}
.ibtn:hover{background:var(--bg3);color:var(--text)}
.ibtn.off{color:var(--red)}
.ibtn.off::after{content:"";position:absolute;width:22px;height:2px;background:var(--red);transform:rotate(-45deg)}

/* ---------- avatars ---------- */
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff;flex:none;position:relative;font-size:16px;user-select:none}
.av.sm{width:32px;height:32px;font-size:13px}
.av .dot{position:absolute;right:-2px;bottom:-2px;width:14px;height:14px;border-radius:50%;border:3px solid var(--bg1)}
.av.sm .dot{width:12px;height:12px}
.dot.online{background:var(--green)}.dot.idle{background:var(--yellow)}.dot.dnd{background:var(--red)}.dot.offline,.dot.invisible{background:#5b6b8a}
.av.anim{animation:avspin 3s linear infinite;background-size:300% 300%!important}
.av.anim::before{content:"";position:absolute;inset:-3px;border-radius:50%;border:2px solid transparent;background:conic-gradient(from var(--a,0deg),var(--pro1),var(--pro2),var(--pro3),var(--pro1)) border-box;-webkit-mask:linear-gradient(#000 0 0) padding-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:ring 2s linear infinite}
@property --a{syntax:"<angle>";inherits:false;initial-value:0deg}
@keyframes ring{to{--a:360deg}}
@keyframes avspin{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}

/* ---------- main chat ---------- */
.main{background:var(--bg2);display:flex;flex-direction:column;min-width:0;min-height:0}
.mhead{height:48px;display:flex;align-items:center;gap:10px;padding:0 14px;border-bottom:1px solid var(--line);flex:none;box-shadow:0 1px 4px #0004}
.mhead .ttl{font-weight:700;white-space:nowrap}
.mhead .topic{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;border-left:1px solid var(--line);padding-left:10px}
.mhead .hb{display:none}
.viewas{background:var(--blue3);color:#fff;padding:6px 14px;font-size:13px;display:flex;gap:10px;align-items:center;flex:none}
.viewas button{background:#fff2;border-radius:5px;padding:2px 10px;margin-left:auto}
.msgs{flex:1;overflow-y:auto;padding:16px 0 8px;min-height:0}
.welcome{padding:16px 16px 20px}
.welcome .big{width:68px;height:68px;border-radius:50%;background:var(--bg4);display:grid;place-items:center;font-size:34px;margin-bottom:10px}
.welcome h1{margin:0 0 4px;font-size:28px}
.welcome p{margin:0;color:var(--muted)}
.msg{display:flex;gap:14px;padding:2px 16px 2px 16px;position:relative;transition:background .08s;border-radius:4px}
.msg.first{margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.msg:hover{background:var(--bg3)}
.msg.mention{background:#3b82f61a;box-shadow:inset 3px 0 var(--blue2)}
.msg .gut{width:40px;flex:none;color:var(--dim);font-size:11px;text-align:right;padding-top:3px;opacity:0}
.msg:hover .gut{opacity:1}
.msg .body{min-width:0;flex:1}
.msg .meta{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.msg .author{font-weight:600;cursor:pointer}.msg .author:hover{text-decoration:underline}
.msg .ts{color:var(--dim);font-size:12px}
.msg .text{white-space:pre-wrap;word-wrap:break-word;overflow-wrap:anywhere}
.msg .text .edited{color:var(--dim);font-size:11px}
.msg .reply{font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center;margin-left:54px;margin-bottom:2px;overflow:hidden;white-space:nowrap}
.msg .reply b{color:var(--text)}
.tag{font-size:10px;font-weight:800;border-radius:4px;padding:1px 5px;background:var(--blue);color:#fff;letter-spacing:.02em;align-self:center}
.tag.pro{background:linear-gradient(90deg,var(--pro1),var(--pro3))}
.tag.bot{background:var(--blue3)}
.mtools{position:absolute;right:16px;top:-14px;background:var(--bg1);border:1px solid var(--line);border-radius:8px;display:none;padding:2px;box-shadow:0 4px 12px #0006;z-index:5}
.msg:hover .mtools{display:flex}
.mtools button{width:30px;height:28px;border-radius:5px;font-size:15px}.mtools button:hover{background:var(--bg3)}
.reacts{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.react{background:var(--bg3);border:1px solid transparent;border-radius:8px;padding:1px 7px;font-size:14px;display:flex;gap:5px;align-items:center}
.react.me{border-color:var(--blue);background:#3b82f62a}
.react.super{background:linear-gradient(90deg,#38bdf833,#a855f733);border-color:var(--pro3)}
.react b{font-size:12px;color:var(--muted)}
.attach{margin-top:6px;background:var(--bg1);border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:inline-flex;gap:10px;align-items:center;max-width:100%}
.attach img{max-width:320px;max-height:240px;border-radius:6px;display:block}
.attach .fi{font-size:28px}
.attach .fn{color:var(--blue2);font-weight:600;word-break:break-all}
.attach .fs{color:var(--dim);font-size:12px}
code{background:#050b18;border-radius:4px;padding:1px 4px;font-family:Consolas,monospace;font-size:.9em}
pre{background:#050b18;border:1px solid var(--line);border-radius:6px;padding:8px;white-space:pre-wrap;margin:4px 0;font-family:Consolas,monospace;font-size:.9em}
.ment{background:#3b82f640;color:#bcd6ff;border-radius:4px;padding:0 3px;font-weight:600;cursor:pointer}
.ment:hover{background:var(--blue);color:#fff}
.spoil{background:#000;color:transparent;border-radius:4px;cursor:pointer;padding:0 2px}.spoil.shown{background:#fff1;color:inherit}
a{color:var(--blue2)}
.cemo{width:22px;height:22px;vertical-align:-5px;display:inline-grid;place-items:center;font-size:19px}
.bigemoji .cemo,.bigemoji{font-size:40px;line-height:1.15}

.composer{padding:0 16px 20px;flex:none;position:relative}
.replybar{background:var(--bg1);border-radius:8px 8px 0 0;padding:7px 12px;font-size:13px;color:var(--muted);display:flex;justify-content:space-between}
.cbox{background:var(--bg3);border-radius:10px;display:flex;align-items:flex-end;gap:4px;padding:4px 6px}
.replybar+.cbox{border-radius:0 0 10px 10px}
.cbox textarea{background:transparent;border:0;resize:none;max-height:200px;padding:10px 4px;line-height:1.4}
.cbox .ibtn{height:40px;width:36px;font-size:19px}
.counter{position:absolute;right:28px;bottom:2px;font-size:11px;color:var(--dim)}
.counter.over{color:var(--red);font-weight:700}
.typing{height:20px;font-size:13px;color:var(--muted);padding:0 18px;flex:none}
.typing .dots span{display:inline-block;width:5px;height:5px;background:var(--muted);border-radius:50%;margin-right:2px;animation:bl 1.2s infinite}
.typing .dots span:nth-child(2){animation-delay:.2s}.typing .dots span:nth-child(3){animation-delay:.4s}
@keyframes bl{0%,80%,100%{opacity:.25}40%{opacity:1}}
.noperm{background:var(--bg3);border-radius:10px;padding:13px 16px;color:var(--dim)}

/* ---------- members ---------- */
.members{background:var(--bg1);overflow-y:auto;padding:12px 8px}
.mgroup{color:var(--muted);font-size:12px;font-weight:700;text-transform:uppercase;padding:14px 8px 4px;letter-spacing:.03em}
.member{display:flex;gap:10px;align-items:center;padding:5px 8px;border-radius:6px;cursor:pointer}
.member:hover{background:var(--bg3)}
.member.offline{opacity:.45}
.member .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
.member .cs{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.member .crown{color:var(--yellow);font-size:12px}

/* ---------- home ---------- */
.homebtn{width:100%;display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:6px;color:var(--muted);font-weight:600}
.homebtn:hover{background:var(--bg3);color:var(--text)}.homebtn.active{background:var(--bg4);color:#fff}
.homebtn .ico{width:24px;text-align:center;font-size:18px}
.dmhead{color:var(--muted);font-size:12px;font-weight:700;text-transform:uppercase;padding:16px 8px 6px;display:flex;justify-content:space-between}
.friends{padding:16px 24px;overflow-y:auto}
.friend{display:flex;gap:12px;align-items:center;padding:10px;border-top:1px solid var(--line);border-radius:6px;cursor:pointer}
.friend:hover{background:var(--bg3)}
.friend .acts{margin-left:auto;display:flex;gap:6px}
.friend .acts button{width:36px;height:36px;border-radius:50%;background:var(--bg1)}
.tabs{display:flex;gap:6px;align-items:center}
.tabs button{padding:3px 10px;border-radius:5px;color:var(--muted);font-weight:600}
.tabs button.active,.tabs button:hover{background:var(--bg4);color:#fff}
.tabs button.green{background:var(--green);color:#fff}

/* ---------- pro ---------- */
.probanner{margin:8px;border-radius:12px;padding:14px;background:linear-gradient(135deg,#1e3a8a,#4338ca 60%,#7c3aed);position:relative;overflow:hidden}
.probanner h3{margin:0 0 4px;font-size:17px}
.probanner p{margin:0 0 10px;font-size:13px;color:#dbe6ff}
.shine{position:relative;overflow:hidden}
.shine::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,#fff4,transparent);animation:shine 3s infinite}
@keyframes shine{to{left:130%}}
.perk{display:flex;gap:12px;align-items:flex-start;padding:10px;border-radius:10px;background:var(--bg1);border:1px solid var(--line)}
.perk .pi{font-size:24px;width:34px;text-align:center}
.perk b{display:block}.perk span{color:var(--muted);font-size:13px}
.perks{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin:14px 0}
.boostbar{height:10px;border-radius:5px;background:var(--bg0);overflow:hidden;margin:10px 0}
.boostbar div{height:100%;background:linear-gradient(90deg,var(--pro1),var(--pro3));transition:width .4s}
.levels{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}

/* ---------- buttons ---------- */
.btn{background:var(--blue);color:#fff;border-radius:6px;padding:9px 16px;font-weight:600;transition:all .15s;cursor:pointer}
.btn:hover:not(:disabled){background:var(--blue3);transform:translateY(-2px);box-shadow:0 4px 12px #5865f240}
.btn:active:not(:disabled){transform:translateY(0)}
.btn.sec{background:var(--bg4);color:var(--text)}.btn.sec:hover:not(:disabled){background:#40444b}
.btn.danger{background:var(--red)}.btn.danger:hover:not(:disabled){background:#d93f3f;box-shadow:0 4px 12px #f0474740}
.btn.pro{background:linear-gradient(90deg,#43b581,#5865f2,#9c27b0);box-shadow:0 4px 12px #5865f240}
.btn.pro:hover{filter:brightness(1.1)}
.btn.ghost{background:none;color:var(--text)}.btn.ghost:hover{background:var(--bg3);border-radius:6px;padding:9px 16px}
.btn:disabled{opacity:.4;cursor:not-allowed}

/* ---------- modals ---------- */
.overlay{position:fixed;inset:0;background:#000b;display:grid;place-items:center;z-index:100;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.modal{background:var(--bg2);border-radius:12px;width:min(460px,94vw);max-height:90vh;overflow:auto;box-shadow:0 8px 30px #0008,0 0 0 1px var(--line);animation:pop .18s}
@keyframes pop{from{transform:scale(.94);opacity:0}}
.modal .mh{padding:20px 20px 6px;text-align:center}
.modal .mh h2{margin:0 0 6px;font-size:22px}
.modal .mh p{margin:0;color:var(--muted);font-size:14px}
.modal .mb{padding:14px 20px}
.modal .mf{padding:14px 20px;background:var(--bg1);display:flex;justify-content:flex-end;gap:8px;border-radius:0 0 12px 12px}
label.l{display:block;font-size:12px;font-weight:700;text-transform:uppercase;color:var(--muted);margin:14px 0 6px;letter-spacing:.03em}
.radio{display:flex;gap:12px;align-items:center;background:var(--bg1);padding:12px;border-radius:8px;margin-bottom:8px;cursor:pointer;border:1px solid transparent}
.radio.sel{border-color:var(--blue);background:var(--bg3)}
.radio .ri{font-size:22px;width:28px;text-align:center}
.radio small{display:block;color:var(--muted)}
.toggle{position:relative;width:42px;height:24px;flex:none}
.toggle input{opacity:0;width:0;height:0;position:absolute}
.toggle span{position:absolute;inset:0;background:#4b5a7a;border-radius:12px;transition:.15s;cursor:pointer}
.toggle span::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.15s}
.toggle input:checked+span{background:var(--blue)}
.toggle input:checked+span::after{left:21px}
.trow{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.trow .tt{flex:1}.trow .tt small{display:block;color:var(--muted);font-size:13px}
.swatches{display:flex;gap:6px;flex-wrap:wrap}
.sw{width:30px;height:30px;border-radius:6px;cursor:pointer;border:2px solid transparent}
.sw.sel{border-color:#fff}
.emogrid{display:grid;grid-template-columns:repeat(8,1fr);gap:2px}
.emogrid button{font-size:22px;padding:4px;border-radius:6px}.emogrid button:hover{background:var(--bg3)}
.emogrid button.locked{opacity:.35;filter:grayscale(1)}

/* ---------- full-screen settings ---------- */
.settings{position:fixed;inset:0;background:var(--bg2);z-index:90;display:flex;animation:fade .15s}
.settings .nav{width:min(260px,38vw);background:var(--bg1);padding:40px 8px 20px;overflow-y:auto;display:flex;flex-direction:column;align-items:flex-end}
.settings .nav>div{width:200px;max-width:100%}
.settings .nav h4{margin:14px 10px 4px;font-size:12px;color:var(--muted);text-transform:uppercase}
.settings .nav button{display:block;width:100%;text-align:left;padding:7px 10px;border-radius:6px;color:var(--muted);margin:1px 0;font-weight:500}
.settings .nav button:hover{background:var(--bg3);color:var(--text)}
.settings .nav button.active{background:var(--bg4);color:#fff}
.settings .nav button.red{color:var(--red)}
.settings .nav button.prob{background:linear-gradient(90deg,#1e3a8a,#6d28d9);color:#fff}
.settings .content{flex:1;overflow-y:auto;padding:40px 40px 80px;max-width:780px}
.settings .content h2{margin:0 0 18px}
.settings .close{position:fixed;right:24px;top:30px;width:38px;height:38px;border-radius:50%;border:2px solid var(--muted);color:var(--muted);font-size:18px;z-index:2}
.settings .close:hover{color:#fff;border-color:#fff}
.rolelist{display:flex;flex-direction:column;gap:4px}
.roleitem{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:6px;background:var(--bg1);cursor:pointer;border:1px solid transparent}
.roleitem:hover{background:var(--bg3)}.roleitem.sel{border-color:var(--blue)}
.rdot{width:12px;height:12px;border-radius:50%;flex:none}
.rolewrap{display:grid;grid-template-columns:200px 1fr;gap:20px}
.chip{display:inline-flex;align-items:center;gap:5px;background:var(--bg1);border:1px solid var(--line);border-radius:5px;padding:2px 7px;font-size:12px;margin:2px;cursor:default}
.chip button{color:var(--muted);font-size:12px}.chip button:hover{color:var(--red)}
.mrow{display:flex;align-items:center;gap:10px;padding:10px;border-bottom:1px solid var(--line);flex-wrap:wrap}

/* ---------- profile popout ---------- */
.pop{position:fixed;z-index:120;width:300px;background:var(--bg1);border-radius:12px;overflow:hidden;box-shadow:0 8px 24px #0008,0 0 0 1px var(--line);animation:pop .14s}
.pop .bn{height:64px}
.pop .pav{margin:-36px 0 0 14px;border:6px solid var(--bg1);width:84px;height:84px;font-size:32px;border-radius:50%}
.pop .pav .dot{width:20px;height:20px;border-width:4px}
.pop .pb{padding:8px 14px 14px}
.pop .pb .card{background:#050b18aa;border-radius:8px;padding:10px;margin-top:8px}
.pop h3{margin:0;font-size:19px;display:flex;gap:6px;align-items:center}
.pop .un{color:var(--muted);font-size:13px}
.pop .sec{font-size:11px;font-weight:800;text-transform:uppercase;color:var(--muted);margin:10px 0 4px}
.badges{display:flex;gap:4px;margin:-30px 10px 0 auto;justify-content:flex-end;height:30px;align-items:center}
.badges span{background:#050b18cc;border-radius:6px;padding:2px 5px;font-size:14px}
.ctx{position:fixed;z-index:130;background:var(--bg1);border:1px solid var(--line);border-radius:8px;padding:6px;min-width:190px;box-shadow:0 8px 24px #0008}
.ctx button{display:block;width:100%;text-align:left;padding:7px 10px;border-radius:4px;font-size:14px}
.ctx button:hover{background:var(--blue)}
.ctx button.red{color:var(--red)}.ctx button.red:hover{background:var(--red);color:#fff}
.ctx hr{border:0;border-top:1px solid var(--line);margin:4px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--blue);color:#fff;padding:10px 18px;border-radius:8px;font-weight:600;z-index:200;box-shadow:0 6px 24px #0008;animation:pop .2s}
.toast.pro{background:linear-gradient(90deg,var(--pro1),var(--pro3))}
.toast.err{background:var(--red)}
.burst{position:fixed;pointer-events:none;z-index:300;font-size:26px;animation:burst 1s ease-out forwards}
@keyframes burst{to{transform:translate(var(--dx),var(--dy)) scale(1.6);opacity:0}}

/* ---------- voice stage ---------- */
.stage{flex:1;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;padding:16px;align-content:center;overflow:auto;background:#040914}
.tile{aspect-ratio:16/9;background:var(--bg1);border-radius:10px;display:grid;place-items:center;position:relative;border:2px solid transparent}
.tile.speaking{border-color:var(--green)}
.tile .av{width:72px;height:72px;font-size:28px}
.tile .lbl{position:absolute;left:8px;bottom:8px;background:#000a;border-radius:5px;padding:2px 8px;font-size:13px;font-weight:600}
.tile.screen{background:linear-gradient(135deg,#0f2b5c,#1e1b4b);grid-column:1/-1;aspect-ratio:auto;min-height:220px}
.tile.screen .q{position:absolute;right:8px;top:8px;background:#000a;border-radius:5px;padding:2px 8px;font-size:12px;font-weight:700}
.stagebar{display:flex;justify-content:center;gap:10px;padding:12px;background:#040914}
.stagebar button{width:52px;height:52px;border-radius:50%;background:var(--bg3);font-size:20px}
.stagebar button:hover{background:var(--bg4)}
.stagebar button.on{background:var(--blue)}.stagebar button.red{background:var(--red)}

/* ---------- mobile ---------- */
@media (max-width:900px){.app{grid-template-columns:72px 240px 1fr}.members{display:none}}
@media (max-width:680px){
  .app,.app.nomembers{grid-template-columns:1fr}
  .rail,.side{position:fixed;top:0;bottom:0;z-index:50;transition:transform .2s}
  .rail{left:0;width:72px}.side{left:72px;width:min(270px,calc(100vw - 72px))}
  .app:not(.drawer) .rail{transform:translateX(-100%)}
  .app:not(.drawer) .side{transform:translateX(calc(-100% - 72px))}
  .mhead .hb{display:grid}
  .app.drawer .scrim{display:block;position:fixed;inset:0;background:#0008;z-index:40}
  .app:not(.drawer) .scrim{display:none}
  .settings{flex-direction:column}.settings .nav{width:100%;padding:56px 8px 8px;flex-direction:row;overflow-x:auto;align-items:flex-start;flex:none}
  .settings .nav>div{width:auto;display:flex;gap:4px;flex-wrap:nowrap}
  .settings .nav h4{display:none}.settings .nav button{white-space:nowrap;width:auto}
  .settings .content{padding:16px 16px 80px}
  .settings .close{top:10px;right:12px}
  .rolewrap{grid-template-columns:1fr}
  .mtools{top:-30px}
}
</style>
</head>
<body>
<div id="root"></div>
<script>
"use strict";
/* =========================================================
   Zpercord — chat app with servers, channels, roles and Pro
   All data lives in the browser (localStorage).
   ========================================================= */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const rand = a => a[Math.floor(Math.random() * a.length)];
const STORE = "zpercord.v1";

const PERMS = [
  ["ADMIN", "Administrador", "Todos los permisos y omite restricciones de canal."],
  ["MANAGE_SERVER", "Gestionar servidor", "Cambiar nombre, icono, banner y emojis."],
  ["MANAGE_CHANNELS", "Gestionar canales", "Crear, editar y eliminar canales y categorías."],
  ["MANAGE_ROLES", "Gestionar roles", "Crear y editar roles inferiores."],
  ["KICK", "Expulsar miembros", "Echar a miembros del servidor."],
  ["VIEW", "Ver canales", "Ver los canales públicos."],
  ["SEND", "Enviar mensajes", "Escribir en canales de texto."],
  ["ATTACH", "Adjuntar archivos", "Subir archivos e imágenes."],
  ["REACT", "Añadir reacciones", "Reaccionar a mensajes."],
  ["MENTION_ALL", "Mencionar @everyone", "Notificar a todo el servidor."],
  ["CONNECT", "Conectar a voz", "Unirse a canales de voz."],
  ["STREAM", "Transmitir", "Compartir pantalla en canales de voz."],
];
const DEFAULT_EVERYONE = { VIEW: 1, SEND: 1, ATTACH: 1, REACT: 1, CONNECT: 1, STREAM: 1 };
const COLORS = ["#5865f2", "#7289da", "#43b581", "#faa61a", "#f04747", "#9c27b0", "#2ecc71", "#e91e63", "#00bcd4", "#ff9800", "#3f51b5", "#00897b", "#c2185b", "#1976d2", "#512da8", "#d32f2f"];
const AVATAR_BG = ["#5865f2", "#7289da", "#43b581", "#faa61a", "#f04747", "#9c27b0", "#2ecc71", "#e91e63", "#00bcd4", "#ff9800"];
const EMOJIS = "😀 😂 🤣 😊 😍 🥰 😎 🤔 😮 😢 😭 😡 🥳 😴 🤯 🙃 👍 👎 👏 🙌 🙏 💪 👀 🔥 ✨ 💯 ❤️ 💙 💜 💔 ✅ ❌ ⭐ 🎉 🎮 🎧 🎵 🍕 🍔 ☕ 🌙 ☀️ 🌊 🚀 💎 🏆 🐱 🐶 🦊 🐸 👾 🤖 💀 👻 🫡".split(" ");
const LEVELS = [0, 2, 7, 14];
const MSG_LIMIT = 4000;
const UPLOAD_LIMIT = 500 * 1024 * 1024;

/* ---------------- seed data - clean state like Discord -------- */
function seed() {
  const users = {
    me: { id: "me", name: "Tú", username: "tu_usuario", color: rand(AVATAR_BG), status: "online", about: "", custom: "", pro: false, anim: false, bannerColor: "#5865f2", themeA: "#5865f2", themeB: "#7289da", emojiAv: "" },
  };
  return {
    users, servers: [],
    dms: {}, dmOrder: [], friends: [],
    pending: [],
    read: {}, myBoosts: {}, settings: { compact: false, sounds: true },
    cur: { server: null, channel: null, dm: null },
  };
}
function makeServer(name, icon, color, withDefaults, isPublic = false) {
  const s = { id: uid(), name, icon, color, ownerId: "me", banner: "", boosts: 0, public: isPublic, roles: [{ id: "everyone", name: "@everyone", color: "", hoist: false, perms: { ...DEFAULT_EVERYONE } }], members: [{ userId: "me", roles: [] }], categories: [], channels: [], emojis: [], messages: {}, desc: "" };
  if (withDefaults) {
    const t = { id: uid(), name: "Canales de texto" }, v = { id: uid(), name: "Canales de voz" };
    s.categories.push(t, v);
    s.channels.push({ id: uid(), name: "general", type: "text", categoryId: t.id, topic: "", private: false, roles: [] });
    s.channels.push({ id: uid(), name: "General", type: "voice", categoryId: v.id, private: false, roles: [] });
  }
  return s;
}
function msg(authorId, content, ts = Date.now(), extra = {}) { return { id: uid(), authorId, content, ts, reactions: {}, ...extra }; }

/* ---------------- state ---------------- */
let S;
try { S = JSON.parse(localStorage.getItem(STORE)); } catch (e) { S = null; }
if (!S || !S.users || !S.servers) S = seed();
const UI = { voice: null, muted: false, deaf: false, stream: null, video: false, replyTo: null, viewAs: null, homeTab: "online", typing: {}, editing: null, memberList: true, speaking: {}, blobs: {} };
let saveT;
function save() { clearTimeout(saveT); saveT = setTimeout(() => { try { localStorage.setItem(STORE, JSON.stringify(S)); } catch (e) { } }, 150); }

const me = () => S.users.me;
const user = id => S.users[id] || { id, name: "Usuario desconocido", color: "#475569", status: "offline" };
const server = (id = S.cur.server) => S.servers.find(s => s.id === id);
const channel = (s = server(), id = S.cur.channel) => s && s.channels.find(c => c.id === id);
const member = (s, userId) => s.members.find(m => m.userId === userId);

/* ---------------- permissions ---------------- */
function rolesOf(s, userId) {
  if (userId === "me" && UI.viewAs && UI.viewAs.server === s.id) return ["everyone", ...(UI.viewAs.role === "everyone" ? [] : [UI.viewAs.role])];
  const m = member(s, userId); return ["everyone", ...(m ? m.roles : [])];
}
function can(s, perm, userId = "me", ch = null) {
  if (!s) return true;
  const viewing = userId === "me" && UI.viewAs && UI.viewAs.server === s.id;
  if (s.ownerId === userId && !viewing) return true;
  const rs = rolesOf(s, userId).map(r => s.roles.find(x => x.id === r)).filter(Boolean);
  if (rs.some(r => r.perms.ADMIN)) return true;
  if (ch && ch.private && !rs.some(r => ch.roles.includes(r.id))) return false;
  if (ch && ch.type === "announce" && perm === "SEND" && !rs.some(r => r.perms.MANAGE_CHANNELS)) return false;
  return rs.some(r => r.perms[perm]);
}
function topRole(s, userId, needColor) {
  const rs = rolesOf(s, userId);
  for (const r of s.roles) if (r.id !== "everyone" && rs.includes(r.id) && (!needColor || r.color)) return r;
  return null;
}
function nameColor(s, userId) { if (!s) return ""; const r = topRole(s, userId, true); return r ? r.color : ""; }
function visibleChannels(s) { return s.channels.filter(c => can(s, "VIEW", "me", c)); }
function boostLevel(s) { let l = 0; LEVELS.forEach((n, i) => { if (s.boosts >= n) l = i; }); return l; }
function emojiSlots(s) { return [50, 100, 150, 250][boostLevel(s)]; }

/* ---------------- avatar ---------------- */
function avatar(u, cls = "", status = true) {
  const bg = `background:${u.color}`;
  const inner = u.emojiAv ? `<span style="font-size:1.15em">${esc(u.emojiAv)}</span>` : esc((u.name || "?").slice(0, 1).toUpperCase());
  const st = status ? `<span class="dot ${u.status === "invisible" ? "offline" : u.status}"></span>` : "";
  return `<div class="av ${cls}" style="${bg}" data-user="${u.id}">${inner}${st}</div>`;
}

/* ---------------- formatting ---------------- */
function fmt(text, s) {
  const codeBlocks = [];
  let t = esc(text).replace(/```(?:\w+\n)?([\s\S]*?)```/g, (_, c) => { codeBlocks.push(`<pre>${c.replace(/^\n/, "")}</pre>`); return `\u0000${codeBlocks.length - 1}\u0000`; });
  const inline = [];
  t = t.replace(/`([^`\n]+)`/g, (_, c) => { inline.push(`<code>${c}</code>`); return `\u0001${inline.length - 1}\u0001`; });
  t = t.replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/__(.+?)__/g, "<u>$1</u>").replace(/\*(.+?)\*/g, "<i>$1</i>").replace(/~~(.+?)~~/g, "<s>$1</s>")
    .replace(/\|\|(.+?)\|\|/g, '<span class="spoil">$1</span>')
    .replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>')
    .replace(/^&gt; (.*)$/gm, '<span style="border-left:4px solid var(--dim);padding-left:8px;display:inline-block">$1</span>');
  t = t.replace(/@(everyone|here)\b/g, '<span class="ment">@$1</span>');
  t = t.replace(/@([\w.À-ſ]+)/g, (m, n) => {
    const u = Object.values(S.users).find(u => u.name.toLowerCase() === n.toLowerCase() || u.username === n);
    if (u) return `<span class="ment" data-user="${u.id}">@${esc(u.name)}</span>`;
    if (s) { const r = s.roles.find(r => r.name.toLowerCase() === n.toLowerCase()); if (r) return `<span class="ment" style="color:${r.color};background:${r.color}33">@${esc(r.name)}</span>`; }
    return m;
  });
  t = t.replace(/:([a-z0-9_]{2,32}):/gi, (m, n) => { const e = findEmoji(n); return e ? `<span class="cemo" title=":${n}:">${e.char}</span>` : m; });
  t = t.replace(/\u0001(\d+)\u0001/g, (_, i) => inline[i]).replace(/\u0000(\d+)\u0000/g, (_, i) => codeBlocks[i]);
  return t;
}
function findEmoji(n) { for (const s of S.servers) { const e = s.emojis.find(e => e.name === n); if (e) return { ...e, server: s }; } return null; }
function isMention(m, s) {
  if (m.authorId === "me") return false;
  const c = m.content.toLowerCase();
  if (c.includes("@everyone") || c.includes("@here") || c.includes("@" + me().name.toLowerCase()) || c.includes("@" + me().username)) return true;
  if (s) return rolesOf(s, "me").some(r => { const ro = s.roles.find(x => x.id === r); return ro && r !== "everyone" && c.includes("@" + ro.name.toLowerCase()); });
  return false;
}
function time(ts) { const d = new Date(ts), n = new Date(); const hm = d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }); if (d.toDateString() === n.toDateString()) return "Hoy a las " + hm; const y = new Date(n - 864e5); if (d.toDateString() === y.toDateString()) return "Ayer a las " + hm; return d.toLocaleDateString() + " " + hm; }
function size(b) { if (b < 1024) return b + " B"; if (b < 1048576) return (b / 1024).toFixed(1) + " KB"; return (b / 1048576).toFixed(1) + " MB"; }

/* ---------------- messages store ---------------- */
function msgList(ctx = S.cur) {
  if (ctx.dm) return S.dms[ctx.dm] || (S.dms[ctx.dm] = []);
  const s = server(ctx.server); if (!s) return [];
  return s.messages[ctx.channel] || (s.messages[ctx.channel] = []);
}
const keyOf = ctx => ctx.dm ? "dm:" + ctx.dm : ctx.server + ":" + ctx.channel;
function unreadCount(ctx) { const k = keyOf(ctx), last = S.read[k] || 0; return msgList(ctx).filter(m => m.ts > last && m.authorId !== "me").length; }
function markRead() { if (S.cur.dm || S.cur.channel) { S.read[keyOf(S.cur)] = Date.now(); save(); } }
function serverUnread(s) { let u = false, m = 0; for (const c of visibleChannels(s)) { if (c.type === "voice") continue; const ctx = { server: s.id, channel: c.id }; const k = keyOf(ctx); const last = S.read[k] || 0; const list = s.messages[c.id] || []; for (const x of list) if (x.ts > last && x.authorId !== "me") { u = true; if (isMention(x, s)) m++; } } return { u, m }; }

/* =========================================================
   RENDER
   ========================================================= */
const root = $("#root");
function render() {
  const s = server(); const home = !s;
  const ch = home ? null : channel(s);
  const showMembers = !home && UI.memberList && !(ch && ch.type === "voice");
  root.innerHTML = `<div class="app ${showMembers ? "" : "nomembers"} ${UI.drawer ? "drawer" : ""}">
    <div class="scrim" data-act="closeDrawer"></div>
    ${renderRail()}
    <div class="side">${home ? renderHomeSide() : renderServerSide(s)}${renderVoiceBar()}${renderUserBar()}</div>
    <div class="main">${home ? renderHomeMain() : renderServerMain(s, ch)}</div>
    ${showMembers ? `<div class="members">${renderMembers(s)}</div>` : ""}
  </div>`;
  const box = $(".msgs"); if (box) box.scrollTop = box.scrollHeight;
  const ta = $("#composer"); if (ta && window.innerWidth > 680) { ta.focus(); autoGrow(ta); }
  markRead();
}

function renderRail() {
  let dmU = 0; for (const id of S.dmOrder) dmU += unreadCount({ dm: id });
  let h = `<button class="sicon ${!server() ? "active" : ""}" data-act="home" data-tip="Mensajes directos" style="${!server() ? "" : ""}"><span class="pill"></span>
    <svg width="28" height="28" viewBox="0 0 32 32"><path fill="#fff" d="M6 7h20l-13 12h13v6H6l13-12H6z"/></svg>${dmU ? `<span class="badge">${dmU}</span>` : ""}</button>`;
  for (const id of S.dmOrder) { const n = unreadCount({ dm: id }); if (n) { const u = user(id); h += `<button class="sicon" data-act="openDm" data-id="${id}" data-tip="${esc(u.name)}" style="background:${u.color}">${esc(u.name[0])}<span class="badge">${n}</span></button>`; } }
  h += `<div class="sep"></div>`;
  for (const s of S.servers) {
    const { u, m } = serverUnread(s); const act = server() && server().id === s.id;
    h += `<button class="sicon ${act ? "active" : ""} ${u ? "unread" : ""} ${boostLevel(s) > 0 ? "boosted" : ""}" data-act="server" data-id="${s.id}" data-tip="${esc(s.name)}" data-ctx="server" style="${act ? "" : `background:${s.color}`}"><span class="pill"></span>${s.icon ? `<span style="font-size:22px">${esc(s.icon)}</span>` : esc(initials(s.name))}${m ? `<span class="badge">${m}</span>` : ""}</button>`;
  }
  h += `<button class="sicon add" data-act="newServer" data-tip="Añadir un servidor">+</button>`;
  h += `<button class="sicon" data-act="discover" data-tip="Explorar servidores" style="color:var(--blue2);font-size:20px">🧭</button>`;
  return `<nav class="rail">${h}</nav>`;
}
const initials = n => n.split(/\s+/).map(w => w[0]).join("").slice(0, 3);

function renderHomeSide() {
  let h = `<div class="shead" style="cursor:default"><input placeholder="Buscar o iniciar conversación" style="padding:5px 8px;font-size:13px" data-act="dmSearch"></div><div class="clist">`;
  if (!S.servers.length) {
    h += `<button class="homebtn" style="margin:40px 0 20px;text-align:center;font-weight:700;color:var(--blue)" data-act="newServer"><span style="font-size:28px">➕</span><div>Crear servidor</div></button>`;
    h += `<button class="homebtn" style="margin:0 0 40px;text-align:center;color:var(--muted)" data-act="discover"><span style="font-size:28px">🧭</span><div>Explorar</div></button>`;
  }
  h += `<button class="homebtn ${!S.cur.dm ? "active" : ""}" data-act="friends"><span class="ico">👥</span>Amigos</button>`;
  h += `<button class="homebtn" data-act="openSettings" data-tab="appearance"><span class="ico">🎨</span>Apariencia</button>`;
  h += `<div class="dmhead"><span>Mensajes directos</span><button data-act="newDm" title="Crear MD">＋</button></div>`;
  for (const id of S.dmOrder) {
    const u = user(id), n = unreadCount({ dm: id });
    h += `<div class="member" data-act="openDm" data-id="${id}" style="${S.cur.dm === id ? "background:var(--bg4)" : ""}">${avatar(u, "sm")}<div style="min-width:0;flex:1"><div class="nm" style="${n ? "color:#fff" : ""}">${esc(u.name)}</div>${u.custom ? `<div class="cs">${esc(u.custom)}</div>` : ""}</div>${n ? `<span style="background:var(--red);color:#fff;padding:0 6px;border-radius:9px;font-size:11px">${n}</span>` : ""}</div>`;
  }
  h += `</div>`;
  return h;
}

function renderHomeMain() {
  if (S.cur.dm) {
    const u = user(S.cur.dm);
    return `<div class="mhead"><button class="ibtn hb" data-act="openDrawer">☰</button>${avatar(u, "sm")}<span class="ttl">${esc(u.name)}</span><span class="topic">${esc(u.custom || "")}</span>
      <button class="ibtn" data-act="call" title="Llamada">📞</button><button class="ibtn" data-act="profile" data-id="${u.id}" title="Perfil">👤</button></div>
      <div class="msgs">${`<div class="welcome"><div style="display:inline-block;transform:scale(2);transform-origin:left top;margin-bottom:46px">${avatar(u, "", false)}</div><h1>${esc(u.name)}</h1><p style="font-size:18px;margin-bottom:8px">${esc(u.username || "")}</p><p>Este es el comienzo de tu historial de mensajes directos con <b>${esc(u.name)}</b>.</p></div>`}${renderMessages(msgList(), null)}</div>
      ${renderTyping()}${renderComposer(`Enviar mensaje a @${u.name}`, true, null)}`;
  }
  if (!S.servers.length) {
    return `<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;padding:40px;text-align:center">
      <div style="font-size:120px;margin-bottom:20px">📭</div>
      <h1 style="margin:0 0 8px;font-size:36px">Bienvenido a Zpercord</h1>
      <p style="color:var(--muted);margin:0 0 32px;font-size:16px;max-width:400px">Crea tu primer servidor o únete a uno existente para comenzar a chatear.</p>
      <div style="display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-bottom:40px">
        <button class="btn" style="font-size:15px;padding:12px 24px" data-act="newServer">

function renderMessages(list, s) {

    const reacts = Object.entries(m.reactions || {}).filter(([, v]) => v.length).map(([e, v]) => { const sup = e.startsWith("super:"); const em = sup ? e.slice(6) : e; return `<button class="react ${v.includes("me") ? "me" : ""} ${sup ? "super" : ""}" data-act="react" data-id="${m.id}" data-e="${esc(e)}" title="${v.map(i => user(i).name).join(", ")}">${em}<b>${v.length}</b></button>`; }).join("");

function renderMembers(s) {

    if (u.status === "offline" || u.status === "invisible") { groups.get("offline").list.push(u); continue; }
    const r = hoisted.find(r => m.roles.includes(r.id));
    groups.get(r ? r.id : "online").list.push(u);

  let h = "";

function openServer(id) {
  const s = server(id); if (UI.viewAs && UI.viewAs.server !== id) UI.viewAs = null;

}
function openChannel(id) {

  if (c.type === "voice") { if (!UI.voice || UI.voice.channel !== id) joinVoice(id); }
  else s.lastChannel = id;
  S.cur.channel = id; UI.replyTo = null; UI.editing = null; UI.drawer = false; save(); render();
}
function openDm(id) { if (!S.dmOrder.includes(id)) S.dmOrder.unshift(id); S.cur = { server: null, channel: null, dm: id }; UI.drawer = false; save(); render(); }
function joinVoice(id) {

function sendMessage(text, attachment) {
  const s = server(), ch = channel(s);
  if (text.length > MSG_LIMIT) { toast("Mensaje demasiado largo", "err"); return false; }
  if (s && /@(everyone|here)/.test(text) && !can(s, "MENTION_ALL", "me", ch)) toast("No tienes permiso para mencionar a @everyone; no se notificará.", "err");
  if (text.startsWith("/") && handleCommand(text)) return true;
  const m = msg("me", text, Date.now(), UI.replyTo ? { replyTo: UI.replyTo } : {});
  if (attachment) { m.attachment = attachment.meta; if (attachment.url) UI.blobs[m.id] = attachment.url; }
  msgList().push(m); UI.replyTo = null; save(); render();
  scheduleReply(text);
  return true;
}
function handleCommand(text) {
  const [cmd, ...rest] = text.slice(1).split(" "); const arg = rest.join(" ");
  const push = (c) => { msgList().push(msg("me", text)); setTimeout(() => { msgList().push(msg("zbot", c)); save(); render(); }, 400); save(); render(); };
  switch (cmd.toLowerCase()) {
    case "ayuda": case "help": push("**Comandos de Zbot**\n`/dado` – tira un dado\n`/moneda` – cara o cruz\n`/8ball <pregunta>` – bola mágica\n`/abrazo @usuario` – manda un abrazo\n`/shrug` – ¯\\\\_(ツ)_/¯\n`/limpiar` – borra tus mensajes del canal\n\n**Formato:** `**negrita**`, `*cursiva*`, `__subrayado__`, `~~tachado~~`, `||spoiler||`, `` `código` ``"); return true;
    case "dado": case "roll": push(`🎲 ${me().name} sacó un **${1 + Math.floor(Math.random() * 6)}**`); return true;
    case "moneda": case "flip": push(`🪙 ¡**${rand(["Cara", "Cruz"])}**!`); return true;
    case "8ball": push(`🎱 ${arg ? `"${arg}" → ` : ""}**${rand(["Sí, definitivamente", "Ni lo sueñes", "Pregunta más tarde", "Las señales dicen que sí", "Muy dudoso", "Sin duda"])}**`); return true;

    case "limpiar": { const l = msgList(); for (let i = l.length - 1; i >= 0; i--) if (l[i].authorId === "me") l.splice(i, 1); save(); render(); toast("Mensajes borrados"); return true; }
  }

const REPLIES = {
  hola: ["¡Hola! 👋", "¡Buenas! ¿Qué tal?", "Holaaa 💙"], gg: ["gg wp 🏆", "GG 🔥"],
  juego: ["¿A qué jugamos? 🎮", "Yo me apunto a una partida"], pro: ["Pro mola mucho, el avatar animado es lo mejor 💎", "¡Las súper reacciones son geniales! 💥"],
  "?": ["Buena pregunta 🤔", "Mmm, no estoy seguro", "Creo que sí"],
  generic: ["jajaja 😂", "Totalmente", "¡Qué bueno!", "Interesante 👀", "+1", "No me lo esperaba", "😎", "Me encanta 💙", "¿En serio?", "Eso suena genial ✨"],
};
function scheduleReply(text) {
  const ctx = { ...S.cur }; const s = server(ctx.server);
  let pool;
  if (ctx.dm) pool = [ctx.dm];
  else { const ch = channel(s, ctx.channel); pool = s.members.map(m => m.userId).filter(id => id !== "me" && !user(id).bot && user(id).status !== "offline" && can(s, "VIEW", id, ch)); }
  const mentioned = Object.values(S.users).find(u => u.id !== "me" && text.toLowerCase().includes("@" + u.name.toLowerCase()));
  if (mentioned && pool.includes(mentioned.id)) pool = [mentioned.id];
  if (!pool.length || (!ctx.dm && !mentioned && Math.random() < .3)) return;
  const who = rand(pool); const t = text.toLowerCase();
  let opts = REPLIES.generic;
  for (const k of ["hola", "gg", "juego", "pro"]) if (t.includes(k)) opts = REPLIES[k];
  if (t.endsWith("?")) opts = REPLIES["?"];
  const k = keyOf(ctx);
  setTimeout(() => { UI.typing[k] = who; if (keyOf(S.cur) === k) refreshTyping(); }, 600);
  setTimeout(() => {
    delete UI.typing[k];
    const list = ctx.dm ? (S.dms[ctx.dm] ||= []) : (s.messages[ctx.channel] ||= []);
    const reply = msg(who, rand(opts));
    if (Math.random() < .3 && list.length) { const last = list[list.length - 1]; if (last.authorId === "me") (last.reactions[rand(["👍", "😂", "🔥", "💙"])] ||= []).push(who); }
    list.push(reply); save();
    if (keyOf(S.cur) === k) { const ta = $("#composer"); const val = ta ? ta.value : ""; render(); const t2 = $("#composer"); if (t2) t2.value = val; }
    else { render(); ping(); }
  }, 1800 + Math.random() * 1500);
}
function refreshTyping() { const t = $(".typing"); if (t) t.outerHTML = renderTyping(); }
function ambient() {
  const s = rand(S.servers);
  if (s.id === S.cur.server) return;  // Don't send ambient messages to servers the user is viewing
  const chs = visibleChannels(s).filter(c => c.type === "text");
  if (!chs.length) return;
  const c = rand(chs); const pool = s.members.map(m => m.userId).filter(id => id !== "me" && user(id).status === "online" && !user(id).bot && can(s, "VIEW", id, c));
  if (!pool.length) return;
  const lines = ["¿Alguien conectado? 👀", "Acabo de ver algo increíble", "Buenos días a todos ☀️", "¿Qué tal vuestro día?", "Recomendadme música 🎧", "¿Partida en un rato? 🎮", "@" + me().name + " ¿estás por aquí?", "jajaja el meme de antes 😂"];
  (s.messages[c.id] ||= []).push(msg(rand(pool), rand(lines))); save();
  ping();
}
let actx;
function beep(f = 880, d = .06) { if (!S.settings.sounds) return; try { actx ||= new (window.AudioContext || window.webkitAudioContext)(); const o = actx.createOscillator(), g = actx.createGain(); o.frequency.value = f; o.type = "sine"; g.gain.setValueAtTime(.06, actx.currentTime); g.gain.exponentialRampToValueAtTime(.0001, actx.currentTime + d * 3); o.connect(g).connect(actx.destination); o.start(); o.stop(actx.currentTime + d * 3); } catch (e) { } }

    case "profile": { e.stopPropagation(); const r = a.getBoundingClientRect(); profilePop(id, r.left - 310, r.top); break; }
    case "openSettings": openSettings(a.dataset.tab || "profile"); break;
    case "shop": modal(`<div class="mh"><h2>🛍️ Tienda</h2><p>Decoraciones de avatar y efectos de perfil.</p></div><div class="mb"><div class="perks" style="margin:0">${[["🪐", "Anillo orbital", "2,99 €"], ["🌊", "Efecto olas", "3,99 €"], ["⚡", "Marco eléctrico", "2,49 €"], ["🌌", "Fondo galaxia", "4,99 €"]].map(x => `<div class="perk"><span class="pi">${x[0]}</span><div><b>${x[1]}</b><span>${isPro() ? `<s>${x[2]}</s> −30% con Pro` : x[2]}</span></div></div>`).join("")}</div><p style="color:var(--dim);font-size:12px">Próximamente. Los miembros Pro tendrán descuento.</p></div>`); break;
    case "statusMenu": { const r = a.getBoundingClientRect(); ctxMenu(r.left, r.top - 230, [...["online", "idle", "dnd", "invisible"].map(st => ({ label: `<span class="dot ${st === "invisible" ? "offline" : st}" style="display:inline-block;width:10px;height:10px;border-radius:50%;position:static;border:0"></span> ${statusName(st)}`, fn: () => { me().status = st; save(); render(); } })), "-", { label: "💬 Establecer estado personalizado", fn: customStatusModal }, { label: "👤 Ver perfil", fn: () => profilePop("me", r.left, r.top - 420) }]); break; }
    case "mute": UI.muted = !UI.muted; beep(UI.muted ? 300 : 600); render(); break;
    case "deafen": UI.deaf = !UI.deaf; UI.muted = UI.deaf || UI.muted; render(); break;
    case "joinVoice": joinVoice(id); render(); break;
    case "leaveVoice": leaveVoice(); break;
    case "toggleVideo": UI.video = !UI.video; render(); break;
    case "toggleStream": if (UI.stream) { UI.stream = null; render(); break; } { const s = server(UI.voice.server); if (!can(s, "STREAM", "me", channel(s, UI.voice.channel))) { toast("No tienes permiso para transmitir", "err"); break; }
      modal(`<div class="mh"><h2>🖥️ Compartir pantalla</h2><p>Elige la calidad de la transmisión.</p></div><div class="mb">${[["720p", "30 FPS", false], ["1080p", "60 FPS", true], ["1440p", "60 FPS", true], ["4K", "60 FPS", true]].map(q => `<div class="radio" data-q="${q[0]} ${q[1]}" data-pro="${q[2] ? 1 : ""}"><span class="ri">📺</span><div style="flex:1"><b>${q[0]}</b><small>${q[1]}</small></div>${q[2] ? '<span class="tag pro">PRO</span>' : ""}</div>`).join("")}</div>`, o => {
        $$("[data-q]", o).forEach(b => b.onclick = () => { UI.stream = b.dataset.q; o.remove(); render(); toast("Transmitiendo en " + UI.stream); });
      }); break; }
    case "call": { const id2 = S.cur.dm; msgList().push(msg("me", "📞 Ha iniciado una llamada.")); save(); render(); setTimeout(() => { msgList().push(msg(id2, "Ahora no puedo, ¿luego? 🙏")); save(); render(); }, 2000); break; }
    case "toggleMembers": UI.memberList = !UI.memberList; render(); break;
    case "closeDrawer": UI.drawer = false; render(); break;
    case "openDrawer": UI.drawer = true; render(); break;
    case "exitViewAs": UI.viewAs = null; render(); break;
    case "pins": { const pins = msgList().filter(m => m.pinned); modal(`<div class="mh"><h2>📌 Mensajes fijados</h2></div><div class="mb" style="background:var(--bg2)">${pins.length ? renderMessages(pins, server()) : '<p style="color:var(--muted);text-align:center">Este canal no tiene mensajes fijados todavía.</p>'}</div>`, null, { wide: 1 }); break; }
    case "search": modal(`<div class="mh"><h2>🔍 Buscar</h2></div><div class="mb"><input placeholder="Buscar mensajes en este canal" data-q><div data-res style="margin-top:10px;max-height:50vh;overflow:auto"></div></div>`, o => { const s = server(); $("[data-q]", o).oninput = e => { const q = e.target.value.toLowerCase(); $("[data-res]", o).innerHTML = q ? renderMessages(msgList().filter(m => m.content.toLowerCase().includes(q)), s) || '<p style="color:var(--muted)">Sin resultados</p>' : ""; }; }, { wide: 1 }); break;
    case "attach": { const s = server(); if (s && !can(s, "ATTACH", "me", channel(s))) { toast("No tienes permiso para adjuntar archivos", "err"); break; } $("#file").click(); break; }
    case "gift": if (S.cur.dm) { if (user(S.cur.dm).pro) toast(user(S.cur.dm).name + " ya tiene Pro"); else giftPro(S.cur.dm); } else openSettings("gift"); break;
    case "emojiPicker": emojiPicker(a, em => { const ta = $("#composer"); ta.value += em; ta.focus(); autoGrow(ta); }); break;
    case "quickReact": emojiPicker(a, em => react(id, em.startsWith(":") ? (findEmoji(em.slice(1, -1)) || {}).char || em : em)); break;
    case "superReact": emojiPicker(a, (em, b) => { const ch = em.startsWith(":") ? (findEmoji(em.slice(1, -1)) || {}).char || em : em; const r = a.getBoundingClientRect(); superBurst(r.left, r.top, ch); react(id, "super:" + ch); }, true); break;
    case "react": { const r = a.getBoundingClientRect(); if (a.dataset.e.startsWith("super:")) superBurst(r.left + 10, r.top, a.dataset.e.slice(6)); react(id, a.dataset.e); break; }
    case "reply": UI.replyTo = id; render(); break;
    case "cancelReply": UI.replyTo = null; render(); break;
    case "edit": UI.editing = id; render(); { const eb = $(".editbox"); if (eb) { eb.focus(); eb.selectionStart = eb.value.length; } } break;
    case "cancelEdit": UI.editing = null; render(); break;
    case "saveEdit": saveEdit(id); break;
    case "pin": { const m = msgList().find(x => x.id === id); m.pinned = !m.pinned; save(); render(); toast(m.pinned ? "Mensaje fijado 📌" : "Mensaje desfijado"); break; }
    case "delMsg": { const m = msgList().find(x => x.id === id); confirmBox("Eliminar mensaje", "¿Seguro que quieres eliminar este mensaje?<br><br><i>" + esc(m.content.slice(0, 120)) + "</i>", "Eliminar", () => { const l = msgList(); l.splice(l.indexOf(m), 1); save(); render(); }); break; }
  }
});
function saveEdit(id) { const eb = $(".editbox"); const m = msgList().find(x => x.id === id); if (eb && m) { const v = eb.value.trim(); if (!v) { const l = msgList(); l.splice(l.indexOf(m), 1); } else if (v !== m.content) { m.content = v; m.edited = true; } } UI.editing = null; save(); render(); }
function customStatusModal() {
  modal(`<div class="mh"><h2>Establecer estado personalizado</h2></div><form class="mb" data-f><label class="l">¿Qué está pasando, ${esc(me().name)}?</label><input name="s" maxlength="60" value="${esc(me().custom || "")}" placeholder="🎮 Jugando..."></form><div class="mf"><button class="btn ghost" data-clr>Borrar</button><button class="btn" data-ok>Guardar</button></div>`, o => {
    const go = () => { me().custom = $("[name=s]", o).value.trim(); save(); o.remove(); render(); };
    $("[data-ok]", o).onclick = go; $("[data-f]", o).onsubmit = e => { e.preventDefault(); go(); }; $("[data-clr]", o).onclick = () => { me().custom = ""; save(); o.remove(); render(); };
  });
}

document.addEventListener("keydown", e => {
  if (e.target.id === "composer") {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); const v = e.target.value.trim(); if (v && sendMessage(v)) e.target.value = ""; return; }
    if (e.key === "ArrowUp" && !e.target.value) { const l = msgList(); const mine = [...l].reverse().find(m => m.authorId === "me"); if (mine) { e.preventDefault(); UI.editing = mine.id; render(); const eb = $(".editbox"); eb && eb.focus(); } }
    if (e.key === "Escape" && UI.replyTo) { UI.replyTo = null; render(); }
  }
  if (e.target.classList && e.target.classList.contains("editbox")) {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); saveEdit(e.target.dataset.id); }
    if (e.key === "Escape") { UI.editing = null; render(); }
    return;
  }
  if (e.key === "Escape") { if ($(".overlay")) $$(".overlay").pop().remove(); else if ($("body > .pop,.ctx")) closeAll(); else if (UI.settings) closeSettings(); }
});
document.addEventListener("input", e => { if (e.target.id === "composer") autoGrow(e.target); if (e.target.dataset.act === "dmSearch") { const q = e.target.value.toLowerCase(); $$(".side [data-act=openDm]").forEach(el => el.style.display = el.textContent.toLowerCase().includes(q) ? "" : "none"); } });
document.addEventListener("change", e => {
  if (e.target.id !== "file") return;
  const f = e.target.files[0]; if (!f) return;
  const lim = UPLOAD_LIMIT;
  if (f.size > lim) { toast("El archivo supera " + size(lim), "err"); return; }
  const ta = $("#composer"); const text = ta ? ta.value.trim() : "";
  const image = f.type.startsWith("image/");
  sendMessage(text, { meta: { name: f.name, size: f.size, image }, url: image ? URL.createObjectURL(f) : null });
});
document.addEventListener("submit", e => {
  const f = e.target; if (f.dataset.form !== "addFriend") return; e.preventDefault();
  const n = f.n.value.trim(); if (!n) return;
  const id = "u_" + n.toLowerCase().replace(/\W/g, "");
  if (S.friends.includes(id)) return toast("Ya sois amigos");
  toast("Solicitud enviada a " + n);
  setTimeout(() => { S.users[id] = { id, name: n, username: n.toLowerCase(), color: rand(AVATAR_BG), status: "online", about: "", custom: "" }; S.friends.push(id); S.dms[id] = [msg(id, "¡Hola! Acepté tu solicitud 😊")]; S.dmOrder.unshift(id); save(); render(); toast(n + " aceptó tu solicitud 🎉"); ping(); }, 2500);
  f.reset();
});
document.addEventListener("contextmenu", e => {
  const el = e.target.closest("[data-ctx]"); if (!el) return;
  e.preventDefault(); const x = e.clientX, y = e.clientY;
  const type = el.dataset.ctx, s = server();
  if (type === "server") { const sid = el.dataset.id; ctxMenu(x, y, [{ label: "✔ Marcar como leído", fn: () => { const sv = server(sid); sv.channels.forEach(c => S.read[sid + ":" + c.id] = Date.now()); save(); render(); } }, { label: "👋 Invitar gente", fn: () => { openServer(sid); inviteModal(); } }, { label: "🚀 Mejorar servidor", fn: () => boostServer(sid) }, { label: "⚙️ Ajustes", fn: () => { openServer(sid); openServerSettings(); } }]); }
  if (type === "chan") { const cid = el.dataset.id; const items = [{ label: "✔ Marcar como leído", fn: () => { S.read[s.id + ":" + cid] = Date.now(); save(); render(); } }, { label: "🔗 Copiar enlace", fn: () => { navigator.clipboard?.writeText("https://zpercord.gg/channels/" + cid).catch(() => { }); toast("Enlace copiado"); } }]; if (can(s, "MANAGE_CHANNELS")) items.push("-", { label: "⚙️ Editar canal", fn: () => channelModal(null, cid) }, { label: "🗑️ Eliminar canal", red: 1, fn: () => { channelModal(null, cid); $("[data-del]")?.click(); } }); ctxMenu(x, y, items); }
  if (type === "cat" && can(s, "MANAGE_CHANNELS")) { const cid = el.dataset.id; ctxMenu(x, y, [{ label: "＋ Crear canal", fn: () => channelModal(cid) }, { label: "✏️ Editar categoría", fn: () => categoryModal(cid) }]); }
  if (type === "msg") { const mid = el.dataset.id; const m = msgList().find(q => q.id === mid); if (!m) return; const items = [{ label: "😀 Añadir reacción", fn: () => emojiPicker(el, em => react(mid, em)) }, { label: "↩️ Responder", fn: () => { UI.replyTo = mid; render(); } }, { label: "📋 Copiar texto", fn: () => navigator.clipboard?.writeText(m.content).catch(() => { }) }, { label: m.pinned ? "📌 Desfijar" : "📌 Fijar", fn: () => { m.pinned = !m.pinned; save(); render(); } }]; if (m.authorId === "me") items.push({ label: "✏️ Editar", fn: () => { UI.editing = mid; render(); } }); if (m.authorId === "me" || (s && can(s, "MANAGE_CHANNELS"))) items.push("-", { label: "🗑️ Eliminar mensaje", red: 1, fn: () => { const l = msgList(); l.splice(l.indexOf(m), 1); save(); render(); } }); ctxMenu(x, y, items); }
  if (type === "member" && s) { const uid2 = el.dataset.user; const u = user(uid2); const items = [{ label: "👤 Perfil", fn: () => profilePop(uid2, x - 300, y) }]; if (uid2 !== "me") items.push({ label: "💬 Mensaje", fn: () => openDm(uid2) }); if (can(s, "MANAGE_ROLES")) items.push({ label: "🛡️ Gestionar roles", fn: () => openServerSettings("members") }); if (can(s, "KICK") && uid2 !== "me" && s.ownerId !== uid2) items.push("-", { label: "🚪 Expulsar a " + esc(u.name), red: 1, fn: () => confirmBox("Expulsar a " + u.name, "¿Seguro?", "Expulsar", () => { s.members = s.members.filter(m => m.userId !== uid2); save(); render(); }) }); ctxMenu(x, y, items); }
});
/* tooltips for server rail */
document.addEventListener("mouseover", e => {
  const el = e.target.closest("[data-tip]"); $$(".tip").forEach(t => t.remove()); if (!el || matchMedia("(hover:none)").matches) return;
  const r = el.getBoundingClientRect(); const t = document.createElement("div"); t.className = "tip"; t.textContent = el.dataset.tip; t.style.left = r.right + 14 + "px"; t.style.top = r.top + r.height / 2 - 14 + "px"; document.body.appendChild(t);
});

/* voice "speaking" simulation */
setInterval(() => {
  if (!UI.voice) return; const s = server(UI.voice.server); const c = s && channel(s, UI.voice.channel); if (!c) return;
  const ppl = voiceUsers(s, c); const prev = JSON.stringify(UI.speaking); UI.speaking = {};
  ppl.forEach(id => { if (id === "me" ? !UI.muted && Math.random() < .3 : Math.random() < .4) UI.speaking[id] = 1; });
  if (JSON.stringify(UI.speaking) !== prev) { $$(".vuser,.tile").forEach(() => { }); const side = $(".clist"); if (side && !UI.settings) { const sc = side.scrollTop; const s2 = server(); if (s2) { side.outerHTML = renderServerSide(s2).replace(/^[\s\S]*?<div class="clist">/, '<div class="clist">'); const n = $(".clist"); if (n) n.scrollTop = sc; } }
    const st = $(".stage"); const cur = channel(); if (st && cur && cur.type === "voice") { $$(".tile", st).forEach(t => { const lbl = t.querySelector(".lbl"); if (!lbl) return; const u = ppl.find(id => lbl.textContent.startsWith(user(id).name)); t.classList.toggle("speaking", !!(u && UI.speaking[u])); }); } }
}, 900);
setInterval(ambient, 120000);  // Reduce frequency: every 2 minutes instead of 45 seconds
window.addEventListener("resize", () => { if (innerWidth > 680 && UI.drawer) { UI.drawer = false; render(); } });

render();
</script>
</body>
</html>
